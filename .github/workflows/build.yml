name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip and Locate Android Project
      run: |
        echo "Listing all files:"
        ls -la
        unzip -q "*.zip" -d extracted_project || true
        PROJECT_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
        if [ -n "$PROJECT_DIR" ] && [ "$PROJECT_DIR" != "." ]; then
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
        fi

    - name: Grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} \;

    - name: Build APK with Gradle
      run: |
        GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLE_PATH" ]; then
          $GRADLE_PATH assembleDebug
        else
          echo "Error: gradlew not found!"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
          
