name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip and Find Project Root
      run: |
        echo "Searching for zip files..."
        for z in *.zip; do
          if [ -f "$z" ]; then
            echo "Unzipping $z..."
            unzip -q "$z" -d extracted_src
          fi
        done
        
        # البحث عن مجلد يحتوي على gradlew بعد فك الضغط أو في المستودع نفسه
        GRADLEW_FILE=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_FILE" ]; then
          PROJECT_DIR=$(dirname "$GRADLEW_FILE")
          echo "Found gradlew in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
        else
          echo "Error: gradlew still not found after searching all extracted folders!"
          exit 1
        fi

    - name: Grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} \;

    - name: Build APK with Gradle
      run: |
        GRADLEW_FILE=$(find . -name "gradlew" | head -n 1)
        $GRADLEW_FILE assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
          
