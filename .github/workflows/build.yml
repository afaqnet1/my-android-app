name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip Project Files
      run: |
        # فك ضغط ملف الـ zip الذي قمت برفعه
        unzip -q "*.zip" -d extracted_project
        # نقل الملفات المفقودة للرئيسية إن لزم
        shopt -s dotglob
        mv extracted_project/*/* ./ || mv extracted_project/* ./ || true

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        fi

    - name: Build APK with Gradle
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        else
          echo "Gradle wrapper not found, looking for alternative build..."
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
          
